# One build job of a staged pull-request build (pr-stages.yaml): builds its recipes with
# the packages of the earlier stages (and the restored cache) as a local channel, and
# passes what it built on to the later stages and the cache as an artifact.
name: PR stage job

on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      platform:
        required: true
        type: string
      os:
        required: true
        type: string
      recipes:
        description: Space-separated recipes
        required: true
        type: string
      artifact:
        description: Name of the artifact with the packages the job builds
        required: true
        type: string

env:
  PYTHONIOENCODING: utf-8
  DISTRO: ${{ inputs.distro }}
  PLATFORM: ${{ inputs.platform }}
  RECIPES: ${{ inputs.recipes }}
  ARTIFACT: ${{ inputs.artifact }}
  ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
  # rattler_build() in tools/robostack.py adds it as a channel (relative to the repository)
  ROBOSTACK_LOCAL_CHANNEL: pr-channel
  # rattler-build writes to distros/<d>/work/output, or to CONDA_BLD_PATH (win-64)
  OUTPUT_DIR: ${{ inputs.platform == 'win-64' && 'D:/bld' || format('distros/{0}/work/output', inputs.distro) }}

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    # git auto-maintenance can leave a lock file in the git clones pixi caches
    # (e.g. vinca's), which breaks every later run restoring that cache
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
    # pixi's package cache on D:, with the builds' (see the Windows step below)
    - name: "pixi's cache on D:"
      if: runner.os == 'Windows'
      shell: pwsh
      run: '"PIXI_CACHE_DIR=D:\pixi-cache" | Out-File -FilePath $env:GITHUB_ENV -Append'
    - uses: prefix-dev/setup-pixi@v0.11.0
      with:
        locked: true  # the lock file must match pixi.toml
        pixi-version: v0.81.0
        cache-write: false  # saved from main only (pixi-cache.yaml)

    - name: Windows workarounds (short build path, long paths, PATH and SDK clean-up)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Defender's real-time scan slows down installing and deleting the environments'
        # files several times over; the runner is thrown away after the job
        Set-MpPreference -DisableRealtimeMonitoring $true
        # the builds, rattler's package cache (on the same drive, for hardlinks) and the
        # temporary files on D:, about three times as fast as C: on GitHub's runners
        "CONDA_BLD_PATH=D:\bld\", "RATTLER_CACHE_DIR=D:\rattler", "TMP=D:\tmp", "TEMP=D:\tmp" |
          Out-File -FilePath $env:GITHUB_ENV -Append
        New-Item -ItemType Directory -Force -Path D:\bld, D:\rattler, D:\tmp | Out-Null
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        Remove-Item -Recurse -Force C:\Strawberry -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "C:\Program Files (x86)\Windows Kits\10\Include\10.0.17763.0" -ErrorAction SilentlyContinue

    # Spotlight indexes every file the environments and builds write, using up to a
    # core or two of the runner's three or four; the runner is thrown away after the job
    - name: Turn off Spotlight
      if: runner.os == 'macOS'
      run: sudo mdutil -a -i off || true

    - name: Clean up PATH
      if: runner.os == 'Windows'
      uses: egor-tensin/cleanup-path@v5
      with:
        dirs: 'C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\Git\cmd;C:\Program Files\Git\mingw64\bin'

    - name: Disable git auto-maintenance in source caches
      shell: bash -l {0}
      run: git config --global maintenance.auto false

    - name: Prepare the work directory
      shell: bash -l {0}
      run: pixi run rs "$DISTRO" prepare
    # the plan job's recipes (generated once for all the jobs)
    - uses: actions/download-artifact@v7
      with:
        name: recipes-${{ inputs.distro }}-${{ inputs.platform }}
        path: distros/${{ inputs.distro }}/work/recipes
    # everything the earlier stages built, and the restored cache
    - uses: actions/download-artifact@v7
      with:
        pattern: pkgs-${{ inputs.distro }}-${{ inputs.platform }}-*
        merge-multiple: true
        path: pr-channel
    - name: Index the earlier stages' packages
      shell: bash -l {0}
      run: |
        mkdir -p "pr-channel/$PLATFORM" pr-channel/noarch
        shopt -s nullglob
        packages=(pr-channel/*/*.conda)
        echo "${#packages[@]} packages from the earlier stages and the cache"
        pixi run rattler-index fs pr-channel --force

    - name: Build recipes
      id: build-recipes
      shell: bash -l {0}
      run: |
        set +e
        args=()
        for recipe in $RECIPES; do args+=(--recipe "./recipes/$recipe"); done
        # shorter work dirs for MAX_PATH on Windows
        [ "$PLATFORM" == "win-64" ] && args+=(--no-build-id)
        # the cache's packages are in pr-channel; build-ci builds independent recipes side by side
        pixi run rs "$DISTRO" build-ci "${args[@]}" --skip-existing=all 2>&1 | tee rattler-build.log
        exit "${PIPESTATUS[0]}"

    - name: Summarize build result
      if: always()
      shell: bash -l {0}
      run: |
        pixi run python tools/summarize_rattler_build.py --log rattler-build.log \
          --platform "$DISTRO $PLATFORM" --outcome "${{ steps.build-recipes.outcome }}" >> "$GITHUB_STEP_SUMMARY"

    # also after a failure: what was built goes into the cache
    - name: Collect the packages
      if: ${{ success() || failure() }}
      shell: bash -l {0}
      run: |
        shopt -s nullglob
        mkdir -p pkgs
        for subdir in "$PLATFORM" noarch; do
          files=("$OUTPUT_DIR/$subdir"/*.conda)
          if (( ${#files[@]} )); then mkdir -p "pkgs/$subdir" && cp "${files[@]}" "pkgs/$subdir/"; fi
        done
        # keeps the <subdir>/ directories in the artifact (it starts at the files' common directory)
        (cd pkgs && printf '%s\n' ./*/*.conda) > "pkgs/manifest-$ARTIFACT.txt"
        cat "pkgs/manifest-$ARTIFACT.txt"
    - name: Upload the packages
      if: ${{ success() || failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact }}
        path: pkgs
        compression-level: 0  # .conda files are compressed
        overwrite: true  # re-runs of a failed job
        retention-days: 3

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: build-log-${{ inputs.artifact }}-${{ github.run_attempt }}
        path: rattler-build.log
        if-no-files-found: warn
        retention-days: 7
