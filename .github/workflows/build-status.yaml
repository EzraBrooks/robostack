# Generated by `pixi run rs rerender` (tools/rerender.py); don't edit. One commit status,
# "All builds", for branch protection: every build workflow (build-<distro>-<platform>.yaml)
# and testpr.yaml of a commit succeeded. Each is a workflow of its own (GitHub doesn't
# start a run with all their jobs), so this follows their runs (tools/build_status.py).
name: Build status

on:
  workflow_run:
    workflows:
      - Build
      - build humble linux-64
      - build humble linux-aarch64
      - build humble osx-64
      - build humble osx-arm64
      - build humble win-64
      - build jazzy linux-64
      - build jazzy linux-aarch64
      - build jazzy osx-64
      - build jazzy osx-arm64
      - build jazzy win-64
      - build lyrical linux-64
      - build lyrical linux-aarch64
      - build lyrical osx-64
      - build lyrical osx-arm64
      - build lyrical win-64
      - build rolling linux-64
      - build rolling linux-aarch64
      - build rolling osx-64
      - build rolling osx-arm64
      - build rolling win-64
    types: [requested, completed]

permissions:
  actions: read
  statuses: write

jobs:
  status:
    runs-on: ubuntu-latest
    concurrency:
      group: build-status-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOWS: '["Build", "build humble linux-64", "build humble linux-aarch64", "build humble osx-64", "build humble osx-arm64", "build humble win-64", "build jazzy linux-64", "build jazzy linux-aarch64", "build jazzy osx-64", "build jazzy osx-arm64", "build jazzy win-64", "build lyrical linux-64", "build lyrical linux-aarch64", "build lyrical osx-64", "build lyrical osx-arm64", "build lyrical win-64", "build rolling linux-64", "build rolling linux-aarch64", "build rolling osx-64", "build rolling osx-arm64", "build rolling win-64"]'
        run: python3 tools/build_status.py --sha "$SHA" --workflows "$WORKFLOWS"
