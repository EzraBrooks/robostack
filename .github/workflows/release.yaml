# Release builds: starts the rendered build workflows (build-<distro>-<platform>.yaml,
# tools/rerender.py) of the selected distributions and platforms with upload, which build
# the packages missing on each distribution's channel (or the repository variable
# ROBOSTACK_UPLOAD_CHANNEL) and upload them. Started by hand while the build branches
# (main.yaml) still build the releases; each build workflow can be started on its own too.
#
# prefix.dev uploads use trusted publishing: the channels' Repository Access must allow
# the build workflows.
name: Release build

on:
  workflow_dispatch:
    inputs:
      distros:
        description: Space-separated distributions (default all)
        required: false
      platforms:
        description: Space-separated platforms, or linux / osx / win (default all)
        required: false

permissions:
  actions: write  # start the build workflows
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - env:
          DISTROS: ${{ inputs.distros }}
          PLATFORMS: ${{ inputs.platforms }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # the same selection as a pull request's build:<distro> / build:<platform> labels
          labels=$(python3 -c 'import json,os; print(json.dumps([f"build:{n}" for n in (os.environ["DISTROS"] + " " + os.environ["PLATFORMS"]).split()]))')
          distros=$(python3 tools/robostack.py changed-distros --base HEAD --all --labels "$labels" | jq -r '.[]')
          platforms=$(python3 tools/robostack.py build-targets --labels "$labels" | jq -r '.[].platform')
          for distro in $distros; do
            for platform in $platforms; do
              gh workflow run "build-$distro-$platform.yaml" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f upload=true
              echo "started build $distro $platform"
            done
          done
