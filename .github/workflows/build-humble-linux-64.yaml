    needs:
      - plan
      - ros2-action-tutorials-py
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.todo), 'ros2-ackermann-msgs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/stage-job
        with:
          job: ros2-ackermann-msgs
          upload: ${{ inputs.upload == true }}
          anaconda_token: ${{ inputs.upload == true && secrets.ANACONDA_API_TOKEN_HUMBLE || '' }}
          recipes: |
            ros2-ackermann-msgs
            ros-humble-ackermann-msgs
            ros2-actionlib-msgs
            ros-humble-actionlib-msgs
