# Pull-request checks, and the re-render of the build workflows. The builds themselves are
# build-<distro>-<platform>.yaml (tools/rerender.py), each a workflow of its own:
# build-status.yaml sums them up in the "All builds" commit status.
name: Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  PYTHONIOENCODING: utf-8
  SAVE_CACHE_AS_ARTIFACT: 'true'

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      distros: ${{ steps.plan.outputs.distros }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Which distributions changed
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # the build workflows of every changed distribution are re-rendered (whatever the labels)
          if [ -n "$BASE" ]; then
            echo "distros=$(python3 tools/robostack.py changed-distros --base "$BASE")" | tee -a "$GITHUB_OUTPUT"
          else
            echo "distros=[]" | tee -a "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # git auto-maintenance can leave a lock file in the git clones pixi caches
      # (e.g. vinca's), which breaks every later run restoring that cache
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - name: Sanity checks (every distribution assembles, generated files up to date, sorted)
        run: pixi run rs check
      - name: Unit tests of the tooling
        run: pixi run test

  # The patches of every platform, checked once per distribution next to its builds
  # (each check is a rattler-build run, ~13 minutes for all of them on Windows): the
  # recipes of all platforms are generated and merged, since each platform selects
  # its own packages; applying a patch doesn't depend on the host.
  patches:
    needs: plan
    if: needs.plan.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
    name: ${{ matrix.distro }} patches
    runs-on: ubuntu-latest
    env:
      DISTRO: ${{ matrix.distro }}
      # generate-recipes -n leaves out what is on the channel, like the builds do
      ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - name: Generate the recipes of every platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          work="distros/$DISTRO/work"
          all=$(mktemp -d)
          for platform in linux-64 linux-aarch64 osx-64 osx-arm64 win-64; do
            for attempt in 1 2 3; do
              if pixi run rs "$DISTRO" generate-recipes --platform "$platform" -n; then break; fi
              if [[ "$attempt" == 3 ]]; then echo "Recipe generation failed for $platform" >&2; exit 1; fi
              sleep 15
            done
            cp -rn "$work/recipes/." "$all/"  # a package's recipe doesn't depend on the platform
          done
          rm -rf "$work/recipes" && mv "$all" "$work/recipes"
          echo "$(ls "$work/recipes" | wc -l) recipes"
      - name: Check patches
        run: |
          pixi run rs "$DISTRO" check-orphaned-patches
          pixi run rs "$DISTRO" check-patches

  # Re-render, as conda-forge's rerender: the changed distributions' build workflows from
  # their recipes (every recipe, not only the missing ones, so that uploads don't change it).
  render:
    needs: plan
    if: needs.plan.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
        platform: [linux-64, linux-aarch64, osx-64, osx-arm64, win-64]
    name: render ${{ matrix.distro }} ${{ matrix.platform }}
    runs-on: ubuntu-latest
    env:
      DISTRO: ${{ matrix.distro }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - name: Generate every recipe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if pixi run rs "$DISTRO" generate-recipes --all --platform "$PLATFORM"; then break; fi
            if [[ "$attempt" == 3 ]]; then echo "Recipe generation failed after 3 attempts" >&2; exit 1; fi
            sleep 15
          done
      - name: Render the build workflow
        run: |
          pixi run python tools/rerender.py render --distro "$DISTRO" --platform "$PLATFORM"
          git diff --stat
      - uses: actions/upload-artifact@v6
        with:
          name: rendered-${{ matrix.distro }}-${{ matrix.platform }}
          path: .github/workflows/build-${{ matrix.distro }}-${{ matrix.platform }}.yaml
          retention-days: 7

  # A pull request from this repository gets the re-render as a commit (by robostack-bot,
  # so that CI runs on it; this run's build of a stale workflow is cancelled by the new
  # one). One from a fork fails until it has `pixi run rs rerender <distro>`'s commit.
  rerender:
    needs: [plan, render]
    if: ${{ always() && needs.render.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every render succeeded
        if: needs.render.result != 'success'
        run: exit 1
      - name: Bot token
        id: app
        if: vars.ROBOSTACK_BOT_CLIENT_ID != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ROBOSTACK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROBOSTACK_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: rendered-*
          merge-multiple: true
          path: .github/workflows
      - name: Commit the re-render
        env:
          PUSH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain .github/workflows)" ]; then echo "The build workflows are up to date"; exit 0; fi
          git diff --stat
          { echo "### The build workflows need a re-render"; echo; echo '```'; git diff --stat; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # a re-render that doesn't settle (the recipes differ from run to run) would loop
          if [ -z "$PUSH_TOKEN" ] || [ "$(git log -1 --format=%s)" == "Re-render the build workflows" ]; then
            echo "::error::The build workflows are out of date: run \`pixi run rs rerender <distro>\` and commit the result"
            exit 1
          fi
          git config user.name "robostack-bot"
          git config user.email "robostack-bot@users.noreply.github.com"
          git add .github/workflows
          git commit -qm "Re-render the build workflows"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          echo "Pushed the re-render; its run builds it"

  # This workflow's jobs; the builds' are summed up in the "All builds" status
  # (build-status.yaml), which branch protection requires too.
  all-green:
    name: All green
    needs: [plan, check, patches, rerender]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded (or had nothing to build)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
