# Generated by `pixi run rs rerender` (tools/rerender.py); don't edit. The selected
# distributions on the selected platforms, each its build-<distro>-<platform>.yaml.
name: Build distributions

on:
  workflow_call:
    inputs:
      distros:
        description: JSON list of distributions
        required: true
        type: string
      platforms:
        description: JSON list of platforms
        required: true
        type: string
      upload:
        description: Upload the packages to the distributions' channels (else keep them as the pull request's cache)
        required: true
        type: boolean

jobs:
  lyrical-linux-64:
    if: contains(fromJSON(inputs.distros), 'lyrical') && contains(fromJSON(inputs.platforms), 'linux-64')
    uses: ./.github/workflows/build-lyrical-linux-64.yaml
    secrets: inherit
    with:
      upload: ${{ inputs.upload }}
