    if: contains(fromJSON(inputs.distros), 'humble') && contains(fromJSON(inputs.platforms), 'linux-64')
    uses: ./.github/workflows/build-humble-linux-64.yaml
    secrets: inherit
    with:
      upload: ${{ inputs.upload }}

