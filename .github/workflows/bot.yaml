# robostack-bot: routine maintenance (see tools/maintenance.py).
#
# - daily: a snapshot PR for every distribution with a new rosdistro sync (the ROS
#   release team tags each sync, e.g. jazzy/2026-10-05; `rosdistro_sync: manual` in
#   distro.yaml opts out, like rolling), and a conda-forge pinning PR when there's a new
#   pinning version or a migration became usable (only packages using a changed pin, and
#   what depends on them, are rebuilt; the PR is labelled dependency-conflict when the
#   new pins can't be installed together).
# - weekly (Mondays): a dependency check of every distribution, kept in one issue per
#   distribution ("<distro>: dependency report", label dependency-report), closed when
#   nothing conflicts; and a PR with the build times the week's build-branch runs
#   recorded (shared/build_timings/, for packing the build jobs by time).
# - monthly (the 1st): a PR upgrading the tooling's pixi dependencies (pixi.toml / pixi.lock).
# - on demand (owners, members and collaborators):
#     Actions > robostack-bot > Run workflow, an issue from the "robostack-bot command"
#     template, or a comment: @robostack-bot <command> [<distro>]
#   commands: update-rosdistro-snapshot [<distro>...|all] | find-stale-packages [<distro>...|all] |
#             update-conda-forge-pinning [<distro>...|all] | add-package <pkg>... [<distro>...] |
#             rebuild <pkg>... [<distro>...|all] [--with-dependents] | update-vinca [<ref>] |
#             dependency-report [<distro>...|all] | update-build-timings | update-pixi |
#             rebuild-dependents (a comment on a pull request: commits the rebuilds its ABI
#             check suggests to its branch; not possible for pull requests from forks)
# - package requests (the "Package request" issue form or `@robostack-bot add-package`,
#   from anyone): the bot opens a PR that adds the packages; maintainers review it.
#   Every other command is for owners, members and collaborators.
#
# PRs are opened with the robostack-bot GitHub App (vars.ROBOSTACK_BOT_CLIENT_ID +
# secrets.ROBOSTACK_BOT_PRIVATE_KEY, falling back to secrets.GHA_PAT) so CI runs on them.
name: robostack-bot

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "43 4 * * 1"  # weekly dependency report (the plan job matches this string)
    - cron: "29 5 1 * *"  # monthly pixi upgrade (the plan job matches this string)
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [add-package, update-rosdistro-snapshot, find-stale-packages, update-conda-forge-pinning, rebuild,
                  update-vinca, dependency-report, update-build-timings, update-pixi]
      distro:
        description: Distribution (for the per-distribution commands; empty = all)
        required: false
      packages:
        description: >-
          For add-package / rebuild, ROS packages and optionally distributions, e.g. "foxglove_bridge humble jazzy"
          (rebuild: add --with-dependents to rebuild what depends on them); for update-vinca, a vinca ref (empty = the pinned branch)
        required: false
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@robostack-bot')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'robostack-bot') ||
                                         contains(github.event.issue.labels.*.name, 'package-request')))
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # git auto-maintenance can leave a lock file in the git clones pixi caches
      # (e.g. vinca's), which breaks every later run restoring that cache
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}  # GitHub API: ros/rosdistro sync tags
          EVENT: ${{ github.event_name }}
          COMMAND: ${{ inputs.command }}
          DISTRO: ${{ inputs.distro }}
          PACKAGES: ${{ inputs.packages }}
          BODY: ${{ github.event.comment.body || github.event.issue.body }}
          ASSOCIATION: ${{ github.event.comment.author_association || github.event.issue.author_association }}
          PULL_REQUEST: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT" in
            schedule)
              if [ "$SCHEDULE" = "29 5 1 * *" ]; then
                echo 'jobs=[{"command":"update-pixi","distro":"","args":"","preview":false}]' | tee -a "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$SCHEDULE" = "43 4 * * 1" ]; then
                # weekly: the dependency reports, and the build times of the week's builds
                jobs=$(ROBOSTACK_BOT_BODY="@robostack-bot dependency-report all" ROBOSTACK_BOT_ASSOCIATION=OWNER pixi run -q rs parse-command |
                       python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin) + [{"command":"update-build-timings","distro":"","args":"","preview":False}]))')
                echo "jobs=$jobs" | tee -a "$GITHUB_OUTPUT"
                exit 0
              fi
              # rosdistro syncs, and the conda-forge pinning: one job for all distributions
              # (they share it; one with its own pinning is updated in the same pull request)
              jobs=$(pixi run -q rs rosdistro-syncs | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin) + [{"command":"update-conda-forge-pinning","distro":"","args":"","preview":False}]))') ;;
            workflow_dispatch)  # only people with write access can dispatch
              jobs=$(ROBOSTACK_BOT_BODY="@robostack-bot $COMMAND $PACKAGES $DISTRO" ROBOSTACK_BOT_ASSOCIATION=OWNER pixi run -q rs parse-command) ;;
            *)
              jobs=$(ROBOSTACK_BOT_BODY="$BODY" ROBOSTACK_BOT_ASSOCIATION="$ASSOCIATION" ROBOSTACK_BOT_PULL_REQUEST="$PULL_REQUEST" pixi run -q rs parse-command) ;;
          esac
          echo "jobs=$jobs" | tee -a "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    permissions:
      actions: read  # update-build-timings: the build-branch runs' artifacts
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Bot token
        id: app
        if: vars.ROBOSTACK_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ROBOSTACK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROBOSTACK_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token || secrets.GHA_PAT || github.token }}
      # git auto-maintenance can leave a lock file in the git clones pixi caches
      # (e.g. vinca's), which breaks every later run restoring that cache
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - name: robostack-bot ${{ matrix.command }} ${{ matrix.distro }}
        id: bot
        env:
          COMMAND: ${{ matrix.command }}
          DISTRO: ${{ matrix.distro }}
          ARGS: ${{ matrix.args }}
          PREVIEW: ${{ matrix.preview }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          # shellcheck disable=SC2086  # ARGS is a list of words (package names, flags, a ref)
          case "$COMMAND" in
            add-package)
              extra=(); [ "$PREVIEW" == "true" ] && extra+=(--preview)
              # shellcheck disable=SC2086  # ARGS is a list of names
              pixi run rs add-package $ARGS "${extra[@]}" --summary "$RUNNER_TEMP/summary.md" ;;
            update-rosdistro-snapshot) pixi run rs "$DISTRO" update-snapshot --summary "$RUNNER_TEMP/summary.md" ;;
            find-stale-packages) pixi run rs "$DISTRO" find-stale --summary "$RUNNER_TEMP/summary.md" ;;
            # no distribution: all of them (rs update-pinning)
            update-conda-forge-pinning) pixi run rs ${DISTRO:+"$DISTRO"} update-pinning --summary "$RUNNER_TEMP/summary.md" ;;
            rebuild) pixi run rs rebuild $ARGS --summary "$RUNNER_TEMP/summary.md" ;;
            # pushes to the pull request's branch itself (with this job's checkout token)
            rebuild-dependents) pixi run rs rebuild-dependents "$ARGS" --summary "$RUNNER_TEMP/summary.md" ;;
            update-vinca) pixi run rs update-vinca $ARGS --summary "$RUNNER_TEMP/summary.md" ;;
            # the build-branch runs' build-times artifacts (actions: read)
            update-build-timings) pixi run rs update-build-timings --summary "$RUNNER_TEMP/summary.md" ;;
            # pixi upgrade (pixi.toml, pixi.lock) first, outside pixi run: it reinstalls the
            # environment the command would run in
            update-pixi)
              # shellcheck disable=SC2046  # the --exclude arguments, one word each
              pixi upgrade --json $(pixi run -q rs update-pixi --excludes) > "$RUNNER_TEMP/pixi-upgrade.json" &&
                pixi run rs update-pixi --changes "$RUNNER_TEMP/pixi-upgrade.json" --summary "$RUNNER_TEMP/summary.md" ;;
            # creates / updates the distribution's dependency-report issue
            dependency-report) pixi run rs "$DISTRO" dependency-report --summary "$RUNNER_TEMP/summary.md" ;;
          esac
          status=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit $status
      - name: Link the request
        if: steps.bot.outputs.changed == 'true' && github.event.issue.number && matrix.command != 'rebuild-dependents'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '\nCloses #%s\n' "$NUMBER" >> "$RUNNER_TEMP/summary.md"
      - name: Open or update the pull request
        id: pr
        if: steps.bot.outputs.changed == 'true' && !matrix.preview && matrix.command != 'rebuild-dependents'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token || secrets.GHA_PAT || github.token }}
          branch: bot/${{ matrix.command }}${{ matrix.distro && format('-{0}', matrix.distro) || '' }}${{ (matrix.command == 'add-package' || matrix.command == 'rebuild') && format('-{0}', github.run_id) || '' }}
          delete-branch: true
          # pinning updates can rebuild a lot: their commits carry [ci skip], so the daily
          # re-creation of the PR (a force push) doesn't start CI; push a commit without it to build
          commit-message: ${{ steps.bot.outputs.title }}${{ matrix.command == 'update-conda-forge-pinning' && ' [ci skip]' || '' }}
          title: ${{ steps.bot.outputs.title }}
          body-path: ${{ runner.temp }}/summary.md
          labels: |
            robostack-bot
            ${{ steps.bot.outputs.labels }}
      - name: Reply on the issue / pull request
        if: always() && (github.event_name == 'issue_comment' || github.event_name == 'issues')
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ steps.bot.outputs.title || 'failed' }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          {
            echo "**robostack-bot ${{ matrix.command }} ${{ matrix.distro }}**: $TITLE"
            echo
            # the pull request it opened (or updated): the reply is otherwise only a copy of its body
            if [ -n "$PR_URL" ]; then
              case "$PR_OPERATION" in updated) echo "Updated pull request: $PR_URL" ;; *) echo "Pull request: $PR_URL" ;; esac
              echo
            fi
            # "Closes #<this issue>" is for the pull request's body, not for the reply
            [ -f "$RUNNER_TEMP/summary.md" ] && grep -v '^Closes #[0-9]*$' "$RUNNER_TEMP/summary.md" || true
            echo
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$RUNNER_TEMP/comment.md"
          pixi run gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$GITHUB_EVENT_NAME" = issues ] && [ "${{ job.status }}" = success ] && [ "${{ matrix.command }}" != add-package ]; then
            pixi run gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
