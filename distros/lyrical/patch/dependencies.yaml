ament_cmake_ros:
  # Break the test-only runtime cycle so a new mutex migration can bootstrap.
  remove_run: ["ros2-rmw-test-fixture-implementation"]
autoware_behavior_velocity_planner:
  add_host: ["cpp-expected"]
autoware_behavior_velocity_planner_common:
  add_host: ["cpp-expected"]
autoware_behavior_velocity_stop_line_module:
  add_host: ["cpp-expected"]
autoware_trajectory:
  add_host: ["fmt", "cpp-expected"]
autoware_utils_debug:
  add_host: ["fmt"]
autoware_utils_pcl:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
backward_ros:
  add_host: ["${{ 'binutils' if linux }}", "${{ 'elfutils' if linux }}", "ros2-ament-cmake-libraries"]
cartographer_ros:
  add_host: ["cartographer 2.*", "libboost-devel", "ceres-solver"]
console_bridge_vendor:
  add_host: ["console_bridge"]
  add_run: ["console_bridge"]
depth_image_proc:
  add_host: ["eigen-abi-devel"]
eigenpy:
  add_host: ["eigen-abi-devel"]
foxglove_bridge:
  add_host: ["ros2-ament-cmake"]
geometric_shapes:
  add_host: ["libboost-devel", "octomap"]
grid_map_rviz_plugin:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
gz_cmake_vendor:
  # https://github.com/gazebo-release/gz_cmake_vendor/blob/lyrical/CMakeLists.txt#L6 for select the right major version
  # (this is true for all gz-* vendor packages) or https://github.com/gazebo-tooling/gazebodistro/blob/master/collection-harmonic.yaml
  # See https://gazebosim.org/docs/latest/ros_installation/#summary-of-compatible-ros-and-gazebo-combinations for mapping between ROS2 and Gazebo distros
  add_host: ["gz-cmake"]
  add_run: ["gz-cmake"]
gz_common_vendor:
  add_host: ["gz-common"]
  add_run: ["gz-common"]
gz_dartsim_vendor:
  add_host: ["dartsim-cpp", "eigen-abi-devel"]
  add_run: ["dartsim-cpp"]
gz_fuel_tools_vendor:
  add_host: ["gz-fuel-tools"]
  add_run: ["gz-fuel-tools"]
gz_gui_vendor:
  add_host: ["gz-gui"]
  add_run: ["gz-gui"]
gz_launch_vendor:
  add_host: ["gz-launch"]
  add_run: ["gz-launch"]
gz_math_vendor:
  add_host: ["gz-math"]
  add_run: ["gz-math"]
gz_msgs_vendor:
  add_host: ["gz-msgs"]
  add_run: ["gz-msgs"]
gz_ogre_next_vendor:
  add_host: ["ogre-next"]
  add_run: ["ogre-next"]
  remove_host: ["shaderc"]
  remove_run: ["shaderc"]
gz_physics_vendor:
  add_host: ["gz-physics"]
  add_run: ["gz-physics"]
gz_plugin_vendor:
  add_host: ["gz-plugin"]
  add_run: ["gz-plugin"]
gz_rendering_vendor:
  add_host: ["gz-rendering", "swig"]
  add_run: ["gz-rendering", "swig"]
gz_ros2_control:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ros2-gz-sensors-vendor"]
gz_ros2_control_demos:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_sensors_vendor:
  add_host: ["gz-sensors"]
  add_run: ["gz-sensors"]
gz_sim_vendor:
  add_host: ["libgz-sim"]
  add_run: ["libgz-sim"]
gz_tools_vendor:
  add_host: ["gz-tools"]
  add_run: ["gz-tools"]
gz_transport_vendor:
  add_host: ["libgz-transport"]
  add_run: ["libgz-transport"]
gz_utils_vendor:
  add_host: ["gz-utils"]
  add_run: ["gz-utils"]
image_view:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see  https://github.com/ros-perception/image_pipeline/blob/746268fcfd21b389bc39ae60bb6345a53c838558/image_view/src/stereo_view_node.cpp#L253
  add_run: ["${{ 'libopencv * *qt6*' if not (ppc64le or aarch64 or osx) }}"]
intra_process_demo:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see https://github.com/ros2/demos/blob/8f361a1ece2daae54016959f3ea9ab2e7692ddbb/intra_process_demo/include/image_pipeline/image_view_node.hpp#L58
  add_run: ["${{ 'libopencv * *qt6*' if not (ppc64le or aarch64 or osx) }}"]
mimick_vendor:
  add_build: ["vcstool"]
moveit_core:
  add_host: ["eigen-abi-devel"]
moveit_visual_tools:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
nav2_constrained_smoother:
  add_host: ["${{ 'openblas' if win }}", "ceres-solver"]
opennav_coverage:
  # package.xml misses deps that CMakeLists.txt finds
  add_host: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
  add_run: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
openvdb_vendor:
  add_host: ["openvdb"]
pcl_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel", "eigen-abi-devel"]
pinocchio:
  add_host: ["eigen-abi-devel"]
plotjuggler:
  # PlotJuggler 3.17 is Qt5-only (find_package(Qt5 ...)); the Qt rosdep keys map to Qt6 here
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["libxcb", "${{ 'elfutils' if linux }}", "ros2-ros-workspace", "qt-main"]
  add_run: ["qt-main"]
plotjuggler_ros:
  # Qt5-only like plotjuggler, which it links
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["qt-main"]
  add_run: ["qt-main"]
py_trees:
  add_host: ["hatchling"]
py_trees_js:
  add_host: ["hatchling"]
py_trees_ros:
  add_host: ["poetry-core"]
py_trees_ros_tutorials:
  # the mock GUI is ported to PyQt6 (patch/ros2-py-trees-ros-tutorials.patch)
  add_run: ["pyqt6"]
py_trees_ros_viewer:
  add_host: ["poetry-core"]
pybind11_json_vendor:
  add_host: ["pybind11_json"]
  add_run: ["pybind11_json"]
python_qt_binding:
  add_host: ["pyqt-builder", "qt6-main", "pyqt6"]
  add_run: ["pyqt-builder", "qt6-main", "pyqt6"]
qt_gui_cpp:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "qt6-main", "pyqt6"]
  add_run: ["pyqt-builder", "qt6-main", "pyqt6"]
rclpy:
  add_host: ["typing_extensions"]
  add_run: ["typing_extensions"]
rmf_building_map_tools:
  add_host: ["ros2-rmf-site-map-msgs"]
  add_run: ["gz-fuel-tools"]
  remove_run: ["ros2-gz-fuel-tools-vendor"]
rmf_fleet_adapter:
  add_host: ["eigen-abi-devel"]
  remove_host: ["eigen"]
rmf_task_sequence:
  # The vendor package's ament config does not load the imported validator
  # target. Make the conda-forge CMake package directly available.
  add_host: ["json_schema_validator"]
  add_run: ["json_schema_validator"]
rmf_traffic:
  add_host: ["octomap"]
  add_run: ["octomap"]
rmf_visualization_schedule:
  add_host: ["asio"]
ros_gz_sim:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ros2-gz-sensors-vendor"]
rqt_gui_cpp:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rtabmap:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ceres-solver", "libboost-devel", "${{ 'libdc1394' if not win }}", "libusb", "vtk"]
rviz_ogre_vendor:
  add_host: ["zlib", "freeimage", "freetype", "assimp", "zziplib", "pugixml", "${{ 'libglu' if linux }}"]
  add_build: ["vcstool"]
  add_run: ["assimp"]
sdformat_urdf:
  add_host: ["sdformat"]
  add_run: ["sdformat"]
sdformat_vendor:
  add_host: ["sdformat"]
  add_run: ["sdformat"]
slam_toolbox:
  add_build: ["${{ 'qt6-main' if (build_platform != target_platform) }}"]
  add_host: ["blas-devel", "ceres-solver"]
spatio_temporal_voxel_layer:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "openvdb"]
spdlog_vendor:
  add_host: ["spdlog"]
  add_run: ["spdlog"]
tf2_eigen_kdl:
  add_host: ["eigen-abi-devel"]
uncrustify_vendor:
  add_host: ["uncrustify"]
  add_run: ["uncrustify"]
ur_moveit_config:
  add_host: ["ros2-rclpy"]
  add_run: ["ros2-rclpy"]
vision_msgs_rviz_plugins:
  add_build: ["${{ 'qt6-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
