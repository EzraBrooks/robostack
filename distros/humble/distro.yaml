# Settings of ros-humble that differ from the other distributions
# (everything else is shared, see the README).
# upload_to: where packages are uploaded, to this channel on each (prefix.dev, anaconda.org);
# read_from: where the builds look up what is already published
channel_name: robostack-humble
upload_to: [anaconda]
read_from: anaconda
pinning_overrides:
  # wxwidgets >= 3.3.2 (and the newest 3.3.1 builds) need gst-plugins-base 1.28 on Linux,
  # which no qt-main 5.15 accepts; mrpt_gui links both
  wxwidgets: [3.3.1]
  # nav2_mppi_controller lists xsimd before xtensor: unpinned, the solver takes the newest
  # xsimd (14), which no xtensor >= 0.25 accepts, and falls back to xtensor 0.23.9, whose
  # xtensor_simd.hpp doesn't build with it. 0.25 brings a matching xsimd (as in jazzy).
  xtensor: [0.25.0]
rosdistro_sync: humble/2026-11-16
